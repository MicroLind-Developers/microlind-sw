[CPU]
# The native MLOS timer/entry budget is qualified for this CPU clock.
# GUI True clock controls host pacing; it does not replace this model setting.
CLOCK_HZ=3000000

[ROM]
START=0xE000
END=0xF3FF

[ROM]
START=0xF800
END=0xFFFF

[RAM]
START=0x0000
END=0xDFFF
BANK_SIZE=16384
AVAILABLE=524288

[SERIAL]
IO_START_ADDRESS=0xF430
IO_END_ADDRESS=0xF43F
IRQ_LEVEL=1

[CF]
IO_START_ADDRESS=0xF418
IO_END_ADDRESS=0xF41F
SECTORS=512
READ_ONLY=false

[PARALLEL]
IO_START_ADDRESS=0xF420
IO_END_ADDRESS=0xF42F
IRQ_LEVEL=2

[MEMORY_MAPPER]
BANK_0_REGISTER=0xF400 # Bank0 = 0x0000 - 0x3FFF
BANK_1_REGISTER=0xF401 # Bank1 = 0x4000 - 0x7FFF
BANK_2_REGISTER=0xF402 # Bank2 = 0x8000 - 0xBFFF
BANK_3_REGISTER=0xF403 # Bank3 = 0xC000 - 0xDFFF (only lower 8k)
WINDOW_0=0x0000-0x3FFF
WINDOW_1=0x4000-0x7FFF
WINDOW_2=0x8000-0xBFFF
WINDOW_3=0xC000-0xDFFF
BUS_SIGNALS_PROVIDER=AM14, AM15, AM16, AM17, AM18, AM19, AM20, AM21

